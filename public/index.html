<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PV Visite Pro V4</title>
<meta name="theme-color" content="#17202a">
<style>
:root{--d:#17202a;--a:#f2b705;--bg:#f4f6f8;--line:#d8dde4;--mut:#697586;--ok:#247a57;--bad:#b42318}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px system-ui;color:var(--d)}header{background:var(--d);color:#fff;padding:15px 18px;position:sticky;top:0;z-index:10}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:21px}.logo small{display:block;font-size:11px;opacity:.7}main{max-width:1100px;margin:auto;padding:14px}.view{display:none}.view.active{display:block}
.card{background:#fff;border:1px solid #e4e7eb;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 4px #0000000b}h1{font-size:25px}h2{font-size:18px;border-left:5px solid var(--a);padding-left:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}textarea{min-height:90px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;background:var(--d);color:#fff}.accent{background:var(--a);color:#111}.light{background:#e9edf2;color:#17202a}.bad{background:var(--bad)}.ok{background:var(--ok)}.muted{color:var(--mut);font-size:12px}.login{max-width:440px;margin:8vh auto}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{background:#f7f8fa;border-radius:10px;padding:13px}.k b{font-size:22px;display:block}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;justify-content:space-between;gap:10px}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#eef1f4;font-weight:800}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{position:relative}.photo img{width:100%;height:160px;object-fit:cover;border-radius:9px}.photo span{position:absolute;left:5px;bottom:5px;background:#000b;color:#fff;padding:4px;border-radius:4px;font-size:10px}.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#000b;color:#fff}
canvas{width:100%;height:180px;border:1px dashed #9aa3ad;border-radius:9px;touch-action:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;display:flex;gap:5px;z-index:20}.nav button{flex:1;border:0;background:none;font-weight:800}
@media(max-width:650px){.grid{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.photo-grid{grid-template-columns:1fr 1fr}}@media print{header,.nav,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header><div class="head"><div class="logo">☀️ PV Visite Pro V4<small>Application connectée de visite technique</small></div><div id="user"></div></div></header>
<main>
<section id="login" class="view active"><div class="card login"><h1>Connexion</h1><p class="muted">Version de démonstration sécurisée par compte utilisateur.</p><label>E-mail</label><input id="email" value="tech@pv.local"><label style="margin-top:10px">Mot de passe</label><input id="password" type="password" value="tech123"><button class="btn accent" style="margin-top:12px;width:100%" onclick="login()">Se connecter</button><p id="loginMsg" class="muted"></p><hr><small>Démo technicien : tech@pv.local / tech123<br>Démo administrateur : admin@pv.local / admin123</small></div></section>

<section id="home" class="view"><h1>Tableau de bord</h1><div class="kpi"><div class="k"><span class="muted">Visites</span><b id="n">0</b></div><div class="k"><span class="muted">En cours</span><b id="draft">0</b></div><div class="k"><span class="muted">Terminées</span><b id="done">0</b></div><div class="k"><span class="muted">Photos</span><b id="photos">0</b></div></div><div class="card"><div class="actions"><button class="btn accent" onclick="newVisit()">＋ Nouvelle visite</button><button class="btn light" onclick="logout()">Déconnexion</button></div></div><div class="card"><input id="search" placeholder="Rechercher un client, une adresse ou un numéro…" oninput="list()"><div id="list" class="list" style="margin-top:10px"></div></div></section>

<section id="editor" class="view"><div class="actions no-print"><button class="btn light" onclick="show('home')">← Dossiers</button><button class="btn accent" onclick="save()">💾 Enregistrer sur le serveur</button><button class="btn light" onclick="window.print()">🖨️ PDF</button></div><div id="editorBody"></div></section>
</main><nav class="nav no-print" id="nav" style="display:none"><button onclick="show('home')">🏠 Accueil</button><button onclick="newVisit()">＋ Nouvelle visite</button></nav>
<script>
let token=localStorage.getItem('pvtoken'),me=null,visits=[],cur=null,photos=[],sigCtx,drawing=false;
const cats=['Vue générale','Toiture','Accès toiture','TGBT','Compteur','Poste HTA','Raccordement','Obstacles','Structure','Autre'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(u,o);if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||r.statusText);return r.status===204?null:r.json()}
async function login(){try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let x=await r.json();if(!r.ok)throw Error(x.error);token=x.token;me=x.user;localStorage.setItem('pvtoken',token);boot()}catch(e){loginMsg.textContent=e.message}}
async function boot(){try{me=await api('/api/me');document.getElementById('user').textContent=me.name+' · '+me.role;nav.style.display='flex';await refresh();show('home')}catch{localStorage.removeItem('pvtoken');show('login')}}
async function refresh(){visits=await api('/api/visits');list()}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')refresh();scrollTo(0,0)}
function newVisit(){cur={id:crypto.randomUUID(),number:'VT-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5),data:{date:new Date().toISOString().slice(0,10)},photos:[],signature:''};renderEditor();show('editor')}
function edit(id){cur=visits.find(x=>x.id===id);renderEditor();show('editor')}
function list(){let q=(document.getElementById('search')?.value||'').toLowerCase(),a=visits.filter(v=>(v.number+JSON.stringify(v.data)).toLowerCase().includes(q));n.textContent=visits.length;draft.textContent=visits.filter(v=>!v.data?.faisabilite).length;done.textContent=visits.filter(v=>v.data?.faisabilite).length;photos.textContent=visits.reduce((a,v)=>a+(v.photos?.length||0),0);document.getElementById('list').innerHTML=a.map(v=>`<div class=item><div><b>${esc(v.number)} — ${esc(v.data?.societe||v.data?.client||'Site')}</b><div class=muted>${esc(v.data?.adresse||'Adresse non renseignée')}</div><span class=pill>${esc(v.data?.faisabilite||'En cours')}</span></div><div class=actions><button class="btn accent" onclick="edit('${v.id}')">Ouvrir</button>${me.role==='admin'?`<button class="btn bad" onclick="removeV('${v.id}')">×</button>`:''}</div></div>`).join('')||'<p class=muted>Aucune visite.</p>'}
async function removeV(id){if(confirm('Supprimer cette visite ?')){await api('/api/visits/'+id,{method:'DELETE'});refresh()}}
function field(k,l,t='text',full=false){return `<div class="${full?'full':''}"><label>${l}</label><input data-k="${k}" type="${t}"></div>`}function select(k,l,o){return `<div><label>${l}</label><select data-k="${k}"><option></option>${o.map(x=>`<option>${x}</option>`).join('')}</select></div>`}function area(k,l){return `<div class=full><label>${l}</label><textarea data-k="${k}"></textarea></div>`}function checks(a){return `<div class=checkgrid>${a.map(([k,l])=>`<label class=check><input data-k="${k}" type=checkbox>${l}</label>`).join('')}</div>`}
function renderEditor(){let d=cur.data||{};editorBody.innerHTML=`<div class=card><h2>${esc(cur.number)}</h2><div class=grid>${field('client','Client')}${field('societe','Société')}${field('adresse','Adresse du site','text',true)}${field('contact','Contact sur site')}${field('telephone','Téléphone','tel')}${field('email','Email','email')}${field('date','Date','date')}${field('technicien','Technicien')}${area('notes','Notes')}</div></div>
<div class=card><h2>Projet</h2>${checks([['objectif_autoconso','Autoconsommation totale'],['objectif_injection','Autoconsommation avec injection'],['objectif_vente','Vente totale'],['implant_ombriere','Ombrière'],['implant_toiture','Toiture'],['implant_parking','Parking']])}<div class=grid>${field('puissance','Puissance souhaitée (kWc)','number')}${field('conso','Consommation annuelle (kWh)','number')}</div></div>
<div class=card><h2>Bâtiment & toiture</h2><div class=grid>${select('type','Type',['Bureau','Entrepôt','Commerce','Industrie','Collectivité','Autre'])}${field('annee','Année','number')}${field('hauteur','Hauteur (m)','number')}${field('surface','Surface toiture (m²)','number')}${select('toiture','Toiture',['Bac acier','Béton','Membrane PVC / Bitume','Tuiles','Fibrociment','Autre'])}${select('etat','État',['Très bon','Bon','Moyen','Mauvais'])}${field('pente','Pente (°)','number')}${select('orientation','Orientation',['Nord','Est','Sud','Ouest','Sud-Est','Sud-Ouest'])}${field('surface_exp','Surface exploitable (m²)','number')}${area('obstacles','Obstacles / zones non exploitables')}</div></div>
<div class=card><h2>Structure, sécurité & accès</h2><div class=grid>${select('structure','Structure',['Charpente métallique','Béton','Bois','Autre'])}${select('etude_structure','Étude structure',['Oui','Non'])}${field('sections','Sections / éléments visibles')}${field('entraxe','Entraxe')}${area('securite','Accès, sécurité, levage, stockage')}</div></div>
<div class=card><h2>Électricité</h2><div class=grid>${field('puissance_souscrite','Puissance souscrite (kVA)','number')}${field('gestionnaire','Gestionnaire')}${select('tgbt','TGBT accessible',['Oui','Non'])}${field('distance_tgbt','Distance toiture → TGBT (m)','number')}${select('parafoudre','Parafoudre',['Oui','Non'])}${select('place_tgbt','Place au TGBT',['Oui','Non'])}${field('section','Section disponible')}${field('calibre','Calibre général')}${field('distance_onduleur','Distance TGBT → onduleur (m)','number')}${area('electricite','Cheminement / observations électriques')}</div></div>
<div class=card><h2>Contraintes</h2>${checks([['ombres','Ombres'],['amiante','Amiante'],['atex','Zone ATEX'],['occupe','Site occupé'],['reglemente','Accès réglementé'],['erp','ERP'],['icpe','ICPE'],['classe','Bâtiment classé']])}${area('contraintes','Autres contraintes')}</div>
<div class=card><h2>Photos</h2><div class=actions><button class="btn accent" onclick="cam.click()">📷 Photo</button><button class="btn light" onclick="gal.click()">🖼️ Galerie</button></div><input id=cam type=file accept="image/*" capture=environment hidden><input id=gal type=file accept="image/*" multiple hidden><div id=pg class=photo-grid style="margin-top:10px"></div></div>
<div class=card><h2>Conclusion & validation</h2><div class=grid>${select('faisabilite','Faisabilité',['Favorable','Favorable sous réserves','Défavorable'])}${field('livraison','Livraison','date')}${field('chantier','Début chantier','date')}${area('reserves','Réserves')}${area('actions','Actions complémentaires')}${field('gps','GPS')}${field('nom','Nom du technicien')}${field('date_validation','Date','date')}</div><label>Signature</label><canvas id=sig></canvas><button class="btn light" onclick="clearSig()">Effacer</button></div>`;document.querySelectorAll('[data-k]').forEach(x=>{let v=d[x.dataset.k];if(v!==undefined)(x.type==='checkbox'?x.checked=v:x.value=v)});photos=cur.photos||[];renderPhotos();setupSig();cam.onchange=e=>addFiles(e.target.files);gal.onchange=e=>addFiles(e.target.files)}
async function addFiles(fs){for(let f of fs)photos.push({cat:prompt('Catégorie',cats[0])||'Autre',data:await resize(f,1400)});renderPhotos()}
function renderPhotos(){pg.innerHTML=photos.map((p,i)=>`<div class=photo><img src="${p.data}"><span>${esc(p.cat)}</span><button onclick="photos.splice(${i},1);renderPhotos()">×</button></div>`).join('')}
function resize(f,m){return new Promise(ok=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.76))};i.src=r.result};r.readAsDataURL(f)})}
function setupSig(){let c=sig;if(!c)return;let d=devicePixelRatio||1,w=c.clientWidth;c.width=w*d;c.height=180*d;sigCtx=c.getContext('2d');sigCtx.scale(d,d);sigCtx.lineWidth=2;let p=e=>{let r=c.getBoundingClientRect(),t=e.touches?.[0];return{x:(t?t.clientX:e.clientX)-r.left,y:(t?t.clientY:e.clientY)-r.top}};c.onmousedown=e=>{drawing=true;let q=p(e);sigCtx.beginPath();sigCtx.moveTo(q.x,q.y)};c.onmousemove=e=>{if(drawing){let q=p(e);sigCtx.lineTo(q.x,q.y);sigCtx.stroke()}};c.onmouseup=()=>drawing=false;c.ontouchstart=e=>{drawing=true;let q=p(e);sigCtx.beginPath();sigCtx.moveTo(q.x,q.y);e.preventDefault()};c.ontouchmove=e=>{if(drawing){let q=p(e);sigCtx.lineTo(q.x,q.y);sigCtx.stroke();e.preventDefault()}};c.ontouchend=()=>drawing=false}
function clearSig(){sigCtx?.clearRect(0,0,10000,10000)}
async function save(){let d={};document.querySelectorAll('[data-k]').forEach(x=>d[x.dataset.k]=x.type==='checkbox'?x.checked:x.value);cur.data=d;cur.photos=photos;cur.signature=sig.toDataURL();try{await api('/api/visits',{method:'POST',body:JSON.stringify(cur)});await refresh();alert('Dossier synchronisé sur le serveur.')}catch(e){alert('Erreur de synchronisation : '+e.message)}}
function logout(){localStorage.removeItem('pvtoken');location.reload()}
if(token)boot();
</script></body></html>
